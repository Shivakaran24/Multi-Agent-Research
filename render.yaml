# Render Blueprint: one-click deploy of the API, a PostgreSQL database and the static frontend.
# Dashboard -> New -> Blueprint -> pick this repo. See DEPLOY.md for the values to fill in.
#
# Service names must be unique on onrender.com. If "research-assistant-api" is taken, rename it
# here AND update CORS_ORIGINS / ALLOWED_HOSTS / VITE_API_URL to match.
databases:
  - name: research-db
    plan: free
    databaseName: research
    user: research

services:
  - type: web
    name: research-assistant-api
    runtime: docker
    dockerfilePath: ./Backend/Dockerfile
    dockerContext: ./Backend
    plan: free
    healthCheckPath: /readyz
    envVars:
      - key: PORT
        value: "8000"
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: research-db
          property: connectionString
      - key: AUTH_SECRET_KEY
        generateValue: true
      - key: GROQ_API_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      - key: DEMO_EMAIL
        sync: false
      - key: DEMO_PASSWORD
        sync: false
      - key: CORS_ORIGINS
        value: '["https://research-assistant-web.onrender.com"]'
      - key: ALLOWED_HOSTS
        value: '["research-assistant-api.onrender.com"]'
      - key: ALLOW_REGISTRATION
        value: "false"
      # Showcase limits: protect your Groq/Tavily quota from a public link.
      - key: MAX_RUNS_PER_USER_PER_DAY
        value: "5"
      - key: MAX_TOKENS_PER_USER_PER_DAY
        value: "150000"
      - key: MAX_ACTIVE_RUNS_PER_USER
        value: "1"
      - key: MAX_CONCURRENT_RUNS
        value: "1"
      - key: MAX_PARALLEL_GRAPH_TASKS
        value: "1"

  - type: web
    name: research-assistant-web
    runtime: static
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: frontend/dist
    envVars:
      - key: VITE_API_URL
        value: https://research-assistant-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
