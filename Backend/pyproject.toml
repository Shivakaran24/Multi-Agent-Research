[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "multi-agent-research-assistant"
version = "0.1.0"
description = "A checkpointed LangGraph workflow for iterative, cited research."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "langgraph>=0.2.0",
  "langchain-groq>=1.1.3",
  "pydantic>=2.7.0",
  "pydantic-settings>=2.3.0",
  "tavily-python>=0.5.0",
  "python-dotenv>=1.0.0",
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "pypdf>=4.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "ruff>=0.6.0"]
postgres = ["langgraph-checkpoint-postgres>=2.0.0", "psycopg[binary,pool]>=3.2.0"]

[project.scripts]
research-assistant = "research_assistant.cli:main"
research-assistant-api = "research_assistant.api:run"
research-assistant-eval = "research_assistant.evals:main"
research-assistant-create-user = "research_assistant.auth:create_user_cli"

[tool.setuptools.packages.find]
include = ["research_assistant*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F"]
ignore = ["E501"]
